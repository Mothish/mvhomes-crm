{% load crm_tags %}
{% if page.paginator.num_pages > 1 %}
<div class="pagination">
  <span class="muted small">Showing {{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span>
  <span class="pager">
    {% if page.has_previous %}<a class="btn btn-secondary btn-sm" href="?{% url_with page=page.previous_page_number %}">‹ Prev</a>{% endif %}
    <span class="muted small">Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn btn-secondary btn-sm" href="?{% url_with page=page.next_page_number %}">Next ›</a>{% endif %}
  </span>
</div>
{% endif %}
